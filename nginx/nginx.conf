events {}

http {
    # Round robin by default, which is what we want here: consecutive requests
    # from one client land on different instances, so the rate limit only holds
    # if the instances are genuinely sharing state through Redis rather than
    # each counting on their own.
    upstream rate_limiter {
        server app-1:8000;
        server app-2:8000;
        server app-3:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://rate_limiter;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
