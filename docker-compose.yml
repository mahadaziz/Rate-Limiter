x-app: &app
  build: .
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  # Three instances of the same image against one Redis. Nothing about the
  # limit is held in an instance's memory, so it does not matter which one a
  # request lands on.
  app-1:
    <<: *app
    environment:
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: app-1

  app-2:
    <<: *app
    environment:
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: app-2

  app-3:
    <<: *app
    environment:
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: app-3

  # The only published port. Everything enters through the load balancer, so
  # traffic is spread across instances the way it would be in production.
  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
      - app-3
