services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  app:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: app-1
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
